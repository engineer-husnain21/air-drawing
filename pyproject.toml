# Tool configuration only (ruff + pytest). The app is not packaged.
# pytest puts src/ and scripts/ on the path (tests import train.py directly).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
